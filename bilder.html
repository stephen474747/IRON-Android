<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b"><title>IRON // Bilder</title>
<link rel="stylesheet" href="style.css?v=720">
</head>
<body class="v7 v7-bilder">
<div class="grid"></div><div class="scanlines"></div>

<header class="v7-header">
  <div class="v7-header-spacer"></div>
  <a class="v7-logo" href="index.html"><span>I</span><span>R</span><i>O</i><span>N</span><small>BILDER</small></a>
  <div class="v7-clockbox"><small id="hudDate">--.--.----</small><b id="hudTime">--:--</b></div>
</header>

<main class="v7-main">
<section class="v7-subtitle">APPWRITE CLOUD // EINFACHE BILDGALERIE</section>

<section class="v7-panel v7-simple-gallery-head">
  <div>
    <h2>BILDARCHIV</h2>
    <p>Alle Bilder aus deiner IRON Appwrite-Bibliothek.</p>
  </div>
  <div class="v7-simple-gallery-actions">
    <input id="simpleImageSearch" placeholder="Bild suchen ...">
    <button id="simpleImageRefresh">↻ AKTUALISIEREN</button>
  </div>
</section>

<section class="v7-panel">
  <div class="v7-panel-title">ALLE BILDER <span id="simpleImageCount">0</span></div>
  <div id="simpleImageGrid" class="v7-simple-image-grid"><p>Lade Appwrite-Bilder...</p></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script>
<script src="iron-appwrite.js?v=720"></script>
<script src="app.js?v=720"></script>
<script src="mobile-bridge.js?v=720"></script>
<script src="iron-menu.js?v=720"></script>
<script src="iron-v7-ui.js?v=720"></script>
</body>
</html>
