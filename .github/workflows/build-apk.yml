name: Build IRON Android V5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js installieren
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: IRON Mobile Bridge bauen
        run: npm run build:mobile

      - name: Android-Projekt erstellen
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: IRON Native Android Code anwenden
        run: python3 scripts/patch_android.py

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: IRON V5 APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: IRON-Android-V5
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
