name: Build IRON Android V5 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js 22 installieren
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Java 21 installieren
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Dependencies installieren
        run: npm install

      - name: IRON Mobile Code bauen
        run: npm run build:mobile

      - name: Android Projekt erstellen
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: IRON Android Patch anwenden
        run: python3 scripts/patch_android.py

      - name: Gradle Berechtigung setzen
        run: chmod +x android/gradlew

      - name: IRON APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: IRON-Android-V5
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
