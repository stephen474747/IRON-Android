name: Build IRON Android V6.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js 22 installieren
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Java 21 installieren
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Dependencies installieren
        run: npm install

      - name: JavaScript prüfen
        run: |
          node --check www/app.js
          node --check src/mobile.js

      - name: IRON Mobile Code bauen
        run: npm run build:mobile

      - name: Android Projekt erstellen
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: IRON Android Patch anwenden
        run: python3 scripts/patch_android.py

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: IRON V6.1 APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK prüfen
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: IRON V6.1 APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: IRON-Android-V6.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
