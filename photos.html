<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>IRON // Fotos</title>
<link rel="stylesheet" href="style.css?v=650">
</head>
<body>
<div class="grid"></div><div class="scanlines"></div>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">I</span><div><b>IRON</b><small>FOTOS</small></div></a>
  <div class="status"><i></i> <b id="photoLibraryState">APPWRITE</b></div>
</header>

<main class="page-main photos-page">
<section class="page-heading">
  <div class="eyebrow">IRON // BILDER</div>
  <h1>FOTOS<span>.</span></h1>
  <p>Deine gespeicherten Bilder an einem Ort.</p>
</section>

<section class="photo-upload-panel">
  <div class="title">BILD HINZUFÜGEN <i></i></div>
  <input id="photoUploadName" placeholder="Bildname, z. B. Chevalier Roth Logo">
  <textarea id="photoUploadDescription" placeholder="Beschreibung (optional)"></textarea>
  <input id="photoUploadFile" type="file" accept="image/jpeg,image/png,image/webp">
  <div class="photo-actions">
    <button id="photoUploadBtn">↑ HOCHLADEN</button>
    <button id="photoRefreshBtn">↻ AKTUALISIEREN</button>
  </div>
</section>

<section class="panel-section">
  <div class="title">DEINE FOTOS <i></i></div>
  <div id="photoGrid" class="photo-grid"><p>Lade Fotos...</p></div>
</section>
</main>



<div id="response" class="floating-response">Fotos werden aus Appwrite geladen.</div>
<div id="answerText" hidden></div><b id="speechStatus" hidden>READY</b>

<script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script>
<script src="iron-appwrite.js?v=620"></script>
<script src="app.js?v=650"></script>
<script src="mobile-bridge.js?v=620"></script>
<script src="iron-menu.js?v=650"></script>
</body>
</html>
