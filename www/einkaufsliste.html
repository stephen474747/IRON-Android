<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>IRON // Einkaufsliste</title>
<link rel="stylesheet" href="style.css?v=200">
</head>
<body>
<div class="grid"></div><div class="scanlines"></div>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">I</span><div><b>IRON</b><small>PERSONAL SYSTEM</small></div></a>
  <div class="status"><i></i> CLOUD <b id="cloudStatus">CONNECTING</b></div>
</header>

<main class="page-main">
<section class="page-heading">
  <div class="eyebrow">IRON CORE // SHOPPING</div>
  <h1>SHOPPING<br><span>LISTS.</span></h1>
  <p>Alle von IRON erstellten Einkaufslisten.</p>
</section>

<section class="shopping-command">
  <div class="command">
    <span>&gt;</span>
    <input id="commandInput" placeholder="z. B. Iron, erstelle eine Einkaufsliste für Lasagne" autocomplete="off">
    <button id="sendBtn">CREATE</button>
  </div>
  <button class="mini-voice" id="voiceBtn"><span>⌁</span> TALK TO IRON</button>
  <div id="response">Bereit für deine Einkaufsliste.</div>
  <section class="answer-panel compact">
    <div class="answer-head"><span>IRON RESPONSE</span><b id="speechStatus">READY</b></div>
    <div id="answerText">Deine Antwort erscheint hier als Text.</div>
  </section>
</section>

<section class="panel-section">
  <div class="title">EINKAUFSLISTEN <i></i></div>
  <div id="shoppingList" class="screen-list"><p class="muted">Lade Einkaufsliste...</p></div>
</section>
</main>
