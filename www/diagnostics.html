<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRON V4 Diagnose</title><link rel="stylesheet" href="style.css?v=400"><style>body{padding:22px;max-width:1000px;margin:auto}.box{background:#07131c;border:1px solid #1b91b7;padding:16px;margin:12px 0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#02080d;padding:14px}button{padding:11px 16px;margin:4px}.ok{color:#62f5bd}.bad{color:#ff7482}</style></head><body>
<h1>IRON // DIAGNOSE V4</h1><p>Testet genau die Cloud-Routen, die die Android-App verwendet. Es werden keine API-Keys oder Passwörter angezeigt.</p>
<div class="box"><b>Function</b><pre id="base"></pre></div>
<div class="box"><button id="all">ALLE TESTEN</button><button id="copy">DIAGNOSE KOPIEREN</button><button onclick="location.href='hud.html'">ZURÜCK ZUM HUD</button><pre id="result">Bereit.</pre></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script><script src="iron-appwrite.js?v=500"></script><script>
const C=window.IRONCloud,$=s=>document.querySelector(s); const BASE=C?.cfg?.functionDomain||'';
$('#base').textContent=BASE;
async function get(path){const started=performance.now();try{const r=await fetch(BASE+path,{cache:'no-store'}),raw=await r.text();let data;try{data=JSON.parse(raw)}catch{};return {route:path,http:r.status,ok:r.ok&&data?.ok!==false,ms:Math.round(performance.now()-started),source:data?.source||null,preview:data?JSON.stringify(data).slice(0,220):raw.slice(0,220)}}catch(e){return {route:path,ok:false,error:e.message}}}
async function run(){const out={app:'IRON Android V4',function:BASE,time:new Date().toISOString(),tests:[]};out.tests.push(await get('/api/status'));out.tests.push(await get('/api/news'));out.tests.push(await get('/api/stocks?symbols=AAPL'));out.tests.push(await get('/api/weather?city=Luxembourg'));try{const u=await C.currentUser();if(!u)out.tests.push({route:'/api/chat',ok:false,error:'Nicht angemeldet'});else{const started=performance.now(),reply=await C.askAI('Antworte nur mit: IRON CLOUD OK');out.tests.push({route:'/api/chat',ok:true,ms:Math.round(performance.now()-started),preview:String(reply).slice(0,220)})}}catch(e){out.tests.push({route:'/api/chat',ok:false,error:e.message})}$('#result').textContent=JSON.stringify(out,null,2);return out}
$('#all').onclick=run;$('#copy').onclick=async()=>{const t=$('#result').textContent;try{await navigator.clipboard.writeText(t);alert('Diagnose kopiert.')}catch{alert('Kopieren nicht möglich. Markiere den Text manuell.')}};
</script><script src="mobile-bridge.js?v=5"></script></body></html>
